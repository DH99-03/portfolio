  <meta name="description" content="모르면 배워서, 끝까지. 센서에서 AI, 그리고 제조 현장까지 — 권동현 포트폴리오" />
  <meta name="color-scheme" content="light dark" />
  <script>
  /* 라이트/다크 모드: 저장된 선택 → 없으면 시스템 설정. (페이지가 그려지기 전에 적용해 깜빡임 방지) */
  (function(){
    var r=document.documentElement,K="theme",mq=window.matchMedia("(prefers-color-scheme: dark)");
    function saved(){try{var v=localStorage.getItem(K);return v==="light"||v==="dark"?v:null}catch(e){return null}}
    function current(){return saved()||(mq.matches?"dark":"light")}
    function apply(t){r.setAttribute("data-theme",t);var b=document.querySelectorAll("[data-theme-toggle]");for(var i=0;i<b.length;i++)b[i].setAttribute("aria-pressed",t==="dark"?"true":"false")}
    apply(current());
    if(mq.addEventListener)mq.addEventListener("change",function(){if(!saved())apply(current())});
    window.addEventListener("storage",function(e){if(e.key===K)apply(current())});
    document.addEventListener("DOMContentLoaded",function(){
      apply(current());
      var b=document.querySelectorAll("[data-theme-toggle]");
      for(var i=0;i<b.length;i++)b[i].addEventListener("click",function(){
        var n=r.getAttribute("data-theme")==="dark"?"light":"dark";
        try{localStorage.setItem(K,n)}catch(e){}
        apply(n);
      });
    });
  })();
  </script>
